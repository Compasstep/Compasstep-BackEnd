spring:
  config:
    activate:
      on-profile: dev
    import: "optional:application-secret.yml"

  jpa:
    hibernate:
      ddl-auto: update # update나 create 선택 가능
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 200
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${secret.datasource.url}
    username: ${secret.datasource.username}
    password: ${secret.datasource.password}

  data:
    redis:
      host: localhost
      port: 6379
      # password: ${secret.redis.password:}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${secret.mail.username}
    password: ${secret.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:app}
    distribution:
      # p95/p99 보려면 히스토그램/퍼센타일 활성화 권장
      percentiles:
        all: 0.5,0.9,0.95,0.99
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,5s